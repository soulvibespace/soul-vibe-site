# Статики без фреймворка: build.sh собирает dist/ только из файлов сайта.
[build]
  publish = "dist"
  command = "bash build.sh"

# Studio & Space Rental lives on its own page again (rental.html → /rental).
# Old in-page anchors (/pricing#rooms etc.) are forwarded to /rental by a small
# script in pricing.html, because URL fragments never reach the server.

# Long cache for immutable assets, short for HTML so content updates appear fast.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Приложение (PWA, #104): service worker и офлайн-страница всегда свежие, иначе телефоны
# неделями держат старую версию. Манифест — с правильным типом и коротким кэшем.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app/offline.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─────────────────────────────────────────────────────────────────────────────
# Структура сайта 2026-11: /space и /price-list удалены.
# Зал, галерея и удобства — на /about (id="space"), коворкинг и мероприятия — на /rental
# (id="coworking", id="events"), индивидуальная программа — на /pricing (id="personal").
# Якорь в 301 не передать (фрагмент не доходит до сервера), поэтому — просто /about и /rental.
# force = true: правило сработает, даже если старый .html где-то останется в dist.
# Языковые варианты (/ru/space и т. п.) добавляются вместе с S2 (#150) — выше правил /ru/* и /el/*.
[[redirects]]
  from = "/space"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/space.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/price-list"
  to = "/rental"
  status = 301
  force = true

[[redirects]]
  from = "/price-list.html"
  to = "/rental"
  status = 301
  force = true

