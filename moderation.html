<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Модерация отзывов — Soul Vibe Space</title>
  <link rel="icon" href="images/logo.png" />
  <style>
    :root {
      --bg: #f7f4ef; --surface: #fff; --border: #e4ddd2; --text: #2b2620; --muted: #7a7064;
      --primary: #6b4fa0; --ok: #3d5a2e; --bad: #c0392b; --wait: #8a5a00;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Work Sans', system-ui, -apple-system, sans-serif; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
    .box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    input[type=password], textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
    button { font: inherit; cursor: pointer; border-radius: 999px; padding: 8px 16px; border: 1px solid var(--border); background: #fff; color: var(--text); }
    button:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    .btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
    .btn-bad { color: var(--bad); border-color: rgba(192,57,43,.35); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
    .tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .err { color: var(--bad); margin-top: 10px; font-size: .9rem; }
    .muted { color: var(--muted); font-size: .85rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .stars { color: #d69e2e; letter-spacing: 2px; font-size: 1.05rem; }
    .text { white-space: pre-line; overflow-wrap: anywhere; margin: 8px 0 12px; }
    .badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
    .b-pending { background: rgba(196,140,40,.12); color: var(--wait); }
    .b-approved { background: rgba(61,90,46,.1); color: var(--ok); }
    .b-rejected { background: rgba(192,57,43,.1); color: var(--bad); }
    .note { font-size: .85rem; color: var(--bad); margin: -4px 0 10px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Модерация отзывов</h1>
    <p class="sub">Новые отзывы клиентов появляются на сайте только после нажатия «Опубликовать».</p>

    <div id="login" class="box" hidden>
      <form id="loginForm">
        <label for="key">Ключ модерации</label>
        <div class="row">
          <input type="password" id="key" autocomplete="current-password" style="flex:1;min-width:220px" required />
          <button type="submit" class="btn-primary">Войти</button>
        </div>
        <div id="loginErr" class="err" hidden></div>
      </form>
    </div>

    <div id="app" hidden>
      <div class="top">
        <div class="tabs" id="tabs">
          <button data-status="pending" class="active">На модерации <span data-count="pending"></span></button>
          <button data-status="approved">Опубликованы <span data-count="approved"></span></button>
          <button data-status="rejected">Отклонены <span data-count="rejected"></span></button>
        </div>
        <div class="row">
          <button id="refresh">Обновить</button>
          <button id="logout">Выйти</button>
        </div>
      </div>
      <div id="list"><p class="empty">Загрузка…</p></div>
    </div>
  </div>

  <script>
  (function () {
    var API_BASE = window.SVS_API_BASE
      || (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? 'http://localhost:3001' : 'https://soul-vibe-api.onrender.com');
    var KEY_STORE = 'svs_moderation_key';   // sessionStorage: forgotten when the tab closes
    var status = 'pending';
    var $ = function (id) { return document.getElementById(id); };

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function getKey() { try { return sessionStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
    function setKey(k) { try { k ? sessionStorage.setItem(KEY_STORE, k) : sessionStorage.removeItem(KEY_STORE); } catch (e) {} }
    function fmt(iso) { if (!iso) return '—'; var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' }); }
    function stars(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
    var LANG = { ru: 'русский', en: 'английский', el: 'греческий' };

    async function api(path, opts) {
      var res = await fetch(API_BASE + path, Object.assign({}, opts, {
        headers: { 'Content-Type': 'application/json', 'X-Moderation-Key': getKey() }
      }));
      var data = {}; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { var e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; throw e; }
      return data;
    }

    function showLogin(msg) {
      $('app').hidden = true; $('login').hidden = false;
      $('loginErr').hidden = !msg; $('loginErr').textContent = msg || '';
      $('key').focus();
    }

    function card(r) {
      var actions = '';
      if (r.status !== 'approved') actions += '<button class="btn-ok" data-act="approve" data-id="' + esc(r.id) + '">Опубликовать</button>';
      if (r.status !== 'rejected') actions += '<button class="btn-bad" data-act="reject" data-id="' + esc(r.id) + '">' + (r.status === 'approved' ? 'Снять с публикации' : 'Отклонить') + '</button>';
      return '<div class="card">' +
        '<div class="card-head"><div><b>' + esc(r.name) + '</b> <span class="muted">' + esc(r.email || '') + '</span></div>' +
        '<span class="badge b-' + esc(r.status) + '">' + ({ pending: 'на модерации', approved: 'опубликован', rejected: 'отклонён' }[r.status] || esc(r.status)) + '</span></div>' +
        '<div class="stars" aria-label="' + r.rating + ' из 5">' + stars(r.rating) + '</div>' +
        '<p class="text">' + esc(r.text) + '</p>' +
        (r.status === 'rejected' && r.moderation_note ? '<p class="note">Причина: ' + esc(r.moderation_note) + '</p>' : '') +
        '<p class="muted">Отправлен: ' + fmt(r.updated_at) + ' · Первое занятие: ' + esc(r.first_class_date || '—') + (r.service ? ' (' + esc(r.service) + ')' : '') +
        ' · Язык: ' + esc(LANG[r.lang] || r.lang || '—') + '</p>' +
        '<div class="row" style="margin-top:10px">' + actions + '</div></div>';
    }

    async function load() {
      $('list').innerHTML = '<p class="empty">Загрузка…</p>';
      try {
        var d = await api('/api/moderation/reviews?status=' + status);
        $('login').hidden = true; $('app').hidden = false;
        ['pending', 'approved', 'rejected'].forEach(function (s) {
          var el = document.querySelector('[data-count="' + s + '"]');
          if (el) el.textContent = d.counts && d.counts[s] ? '(' + d.counts[s] + ')' : '';
        });
        $('list').innerHTML = d.reviews.length ? d.reviews.map(card).join('')
          : '<p class="empty">' + ({ pending: 'Новых отзывов нет', approved: 'Опубликованных отзывов пока нет', rejected: 'Отклонённых отзывов нет' }[status]) + '</p>';
      } catch (e) {
        if (e.status === 401) { setKey(''); return showLogin('Неверный ключ модерации'); }
        if (e.status === 503) { $('list').innerHTML = '<p class="empty">Модерация не настроена на сервере (нет REVIEWS_MODERATION_KEY) или хранилище недоступно.</p>'; $('login').hidden = true; $('app').hidden = false; return; }
        if (e.status === 429) { $('list').innerHTML = '<p class="empty">Слишком много запросов. Подождите минуту.</p>'; return; }
        if ($('app').hidden) return showLogin('Сервер недоступен, попробуйте позже.');
        $('list').innerHTML = '<p class="empty">Не удалось загрузить отзывы: ' + esc(e.message) + '</p>';
      }
    }

    $('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var k = $('key').value.trim(); $('key').value = '';
      // HTTP headers are Latin-1 only; a key typed in the wrong keyboard layout can't be sent.
      if (!k || /[^\x21-\x7e]/.test(k)) return showLogin('Неверный ключ модерации. Ключ состоит только из латинских букв и цифр — проверьте раскладку клавиатуры.');
      setKey(k); load();
    });
    $('refresh').addEventListener('click', load);
    $('logout').addEventListener('click', function () { setKey(''); showLogin(); });
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-status]'); if (!b) return;
      status = b.getAttribute('data-status');
      document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.toggle('active', x === b); });
      load();
    });
    $('list').addEventListener('click', async function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var act = b.getAttribute('data-act'), note = '';
      if (act === 'reject') {
        note = window.prompt('Причина (увидит только автор отзыва в личном кабинете, можно оставить пустым):', '');
        if (note === null) return;
      }
      b.disabled = true;
      try { await api('/api/moderation/reviews/' + encodeURIComponent(b.getAttribute('data-id')), { method: 'POST', body: JSON.stringify({ action: act, note: note }) }); load(); }
      catch (err) { b.disabled = false; alert('Не удалось: ' + err.message); }
    });

    getKey() ? load() : showLogin();
  })();
  </script>
</body>
</html>
