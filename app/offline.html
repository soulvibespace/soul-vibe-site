<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f8f7f4" />
  <title>No connection | Soul Vibe Space</title>
  <!-- Офлайн-заглушка приложения (PWA, #104). Её отдаёт sw.js, когда страницы нет из-за сети.
       Полностью автономна: без внешних шрифтов, стилей и i18n.js — всё нужное встроено.
       Тексты RU/EN/EL — ниже (те же ключи pwa_offline_* есть в i18n.js). -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f7f4; color: #27231b; display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .off { max-width: 380px; width: 100%; text-align: center; }
    .off-logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 28px; }
    .off-title { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.75rem; line-height: 1.2; margin: 0 0 12px; text-wrap: balance; }
    .off-text { font-size: 1rem; line-height: 1.6; color: #6f6a61; margin: 0 0 28px; }
    .off-btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px;
      border: 0; border-radius: 999px; background: #6B4FA0; color: #fff; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .off-btn:focus-visible { outline: 3px solid #c5b3e8; outline-offset: 3px; }
    .off-hint { font-size: .875rem; color: #8a857c; margin: 20px 0 0; line-height: 1.5; }
    .off-hint a { color: #6B4FA0; }
  </style>
</head>
<body>
  <main class="off" role="main">
    <img class="off-logo" src="/images/app/icon-192.png" alt="Soul Vibe Space" width="72" height="72" />
    <h1 class="off-title" data-k="pwa_offline_title">No internet connection</h1>
    <p class="off-text" data-k="pwa_offline_text">The schedule, your bookings and VIBES need the internet. Check your connection and try again.</p>
    <button type="button" class="off-btn" id="offRetry" data-k="pwa_offline_retry">Try again</button>
    <p class="off-hint"><span data-k="pwa_offline_call">Need to reach the studio?</span> <a href="tel:+35795642888">+357 95 642 888</a></p>
  </main>
  <script>
    (function () {
      var T = {
        en: {
          pwa_offline_title: 'No internet connection',
          pwa_offline_text: 'The schedule, your bookings and VIBES need the internet. Check your connection and try again.',
          pwa_offline_retry: 'Try again',
          pwa_offline_call: 'Need to reach the studio?',
          doc: 'No connection'
        },
        ru: {
          pwa_offline_title: 'Нет подключения к интернету',
          pwa_offline_text: 'Расписанию, вашим записям и VIBES нужен интернет. Проверьте подключение и попробуйте ещё раз.',
          pwa_offline_retry: 'Попробовать снова',
          pwa_offline_call: 'Нужно связаться со студией?',
          doc: 'Нет подключения'
        },
        el: {
          pwa_offline_title: 'Δεν υπάρχει σύνδεση στο internet',
          pwa_offline_text: 'Το πρόγραμμα, οι κρατήσεις σας και τα VIBES χρειάζονται internet. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.',
          pwa_offline_retry: 'Δοκιμάστε ξανά',
          pwa_offline_call: 'Θέλετε να επικοινωνήσετε με το στούντιο;',
          doc: 'Χωρίς σύνδεση'
        }
      };
      var lang = 'en';
      try { lang = localStorage.getItem('svs_lang') || ''; } catch (e) {}
      if (!T[lang]) lang = /^ru/i.test(navigator.language) ? 'ru' : /^el/i.test(navigator.language) ? 'el' : 'en';
      var d = T[lang];
      document.documentElement.lang = lang;
      document.title = d.doc + ' | Soul Vibe Space';
      var els = document.querySelectorAll('[data-k]');
      for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute('data-k'); if (d[k]) els[i].textContent = d[k]; }
      function retry() { location.reload(); }
      document.getElementById('offRetry').addEventListener('click', retry);
      // Сеть вернулась — открываем страницу сами.
      window.addEventListener('online', retry);
    })();
  </script>
</body>
</html>
